name: build-images

# Builds the self-host images from this AGPL snapshot:
#   - ghcr.io/rudolph-46/appflowy-cloud  (this source; no commercial seat limit)
#   - ghcr.io/rudolph-46/appflowy-web    (upstream SPA pinned to the matching era)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      public_host:
        description: "Public base URL baked into the web image (no trailing slash)"
        required: false
        default: "https://edge-production-c142.up.railway.app"

permissions:
  contents: read
  packages: write

env:
  PUBLIC_HOST: ${{ github.event.inputs.public_host || 'https://edge-production-c142.up.railway.app' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Derive WS host
        run: echo "WS_HOST=${PUBLIC_HOST#https://}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push appflowy_cloud
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rudolph-46/appflowy-cloud:v2025.07-1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout AppFlowy-Web (pinned 2025-07-22)
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Web
          ref: db92f1d965d8e99dc99a1cbd63bbf6dc081649f2
          path: web-src

      - name: Build and push appflowy_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/web/Dockerfile.pinned
          push: true
          tags: ghcr.io/rudolph-46/appflowy-web:v2025.07-1
          build-args: |
            AF_BASE_URL=${{ env.PUBLIC_HOST }}
            AF_GOTRUE_URL=${{ env.PUBLIC_HOST }}/gotrue
            AF_WS_URL=wss://${{ env.WS_HOST }}/ws/v1
